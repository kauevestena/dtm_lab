<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COPC spike viewer</title>
<link rel="stylesheet" href="../vendor/potree-1.8.2/build/potree/potree.css">
<link rel="stylesheet" href="../vendor/potree-1.8.2/libs/jquery-ui/jquery-ui.min.css">
<link rel="stylesheet" href="../vendor/potree-1.8.2/libs/openlayers3/ol.css">
<link rel="stylesheet" href="../vendor/potree-1.8.2/libs/spectrum/spectrum.css">
<link rel="stylesheet" href="../vendor/potree-1.8.2/libs/jstree/themes/mixed/style.css">
</head>
<body>
<script src="../vendor/potree-1.8.2/libs/jquery/jquery-3.1.1.min.js"></script>
<script src="../vendor/potree-1.8.2/libs/spectrum/spectrum.js"></script>
<script src="../vendor/potree-1.8.2/libs/jquery-ui/jquery-ui.min.js"></script>
<script src="../vendor/potree-1.8.2/libs/other/BinaryHeap.js"></script>
<script src="../vendor/potree-1.8.2/libs/tween/tween.min.js"></script>
<script src="../vendor/potree-1.8.2/libs/d3/d3.js"></script>
<script src="../vendor/potree-1.8.2/libs/proj4/proj4.js"></script>
<script src="../vendor/potree-1.8.2/libs/openlayers3/ol.js"></script>
<script src="../vendor/potree-1.8.2/libs/i18next/i18next.js"></script>
<script src="../vendor/potree-1.8.2/libs/jstree/jstree.js"></script>
<script src="../vendor/potree-1.8.2/libs/copc/index.js"></script>
<script src="../vendor/potree-1.8.2/build/potree/potree.js"></script>
<div class="potree_container" style="position:absolute;inset:0">
  <div id="potree_render_area"></div>
  <div id="potree_sidebar_container"></div>
</div>
<script type="module">
const params = new URLSearchParams(location.search);
const url = params.get('copc') || '../data/cooper.copc.laz';
const viewer = window.viewer = new Potree.Viewer(document.getElementById('potree_render_area'));
viewer.setEDLEnabled(true);
viewer.setFOV(60);
viewer.setPointBudget(3_000_000);
viewer.setBackground('gradient');
viewer.loadGUI(() => { viewer.setLanguage('en'); $('#menu_tools').next().show(); });
const t0 = performance.now();
Potree.loadPointCloud(url, 'cooper', (e) => {
  viewer.scene.addPointCloud(e.pointcloud);
  const m = e.pointcloud.material;
  m.pointSizeType = Potree.PointSizeType.ADAPTIVE;
  m.activeAttributeName = params.get('attr') || 'classification';
  viewer.fitToScreen(0.6);
  window.__spike = { loadedMs: performance.now() - t0, pc: e.pointcloud };
  console.log('[spike] hierarchy loaded in', Math.round(window.__spike.loadedMs), 'ms');
});
</script>
</body>
</html>
